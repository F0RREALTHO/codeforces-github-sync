name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Build Chrome & Edge bundles
        run: |
          npm run build
          npm run build:edge

      - name: Build Firefox bundle
        run: npm run build:firefox

      - name: Check backend worker
        working-directory: backend
        run: |
          npm ci
          npm run check
